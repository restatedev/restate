syntax = "proto3";

package dev.restate.ingress.ingestion.v1;

option java_multiple_files = true;
option java_package = "dev.restate.ingestion.v1";
option java_outer_classname = "IngestionProto";

// Required.
// A Start frame must be sent before any IngestionDefaults or
// IngestionInvocation frame.
// Sending a Start frame again during the lifetime of
// the stream is illegal: the server will return an
// error and terminate the stream.
//
// Invalid Start message will cause an error
// to be returned immediately, and stream to be teared down
// immediately
message IngestionStart {
    // Stable identity of the *producer*, not of this particular stream.
    //
    // The ID is an opaque string: this API is generic, so the server
    // attaches no format or meaning to it. It is entirely up to the producer
    // to pick an ID that uniquely identifies a single source of sequential,
    // ordered messages, since offsets are only meaningful relative to that
    // source. For a Kafka-based producer, for instance, an ID composed of
    // cluster + topic + consumer-group + partition would identify such a
    // source.
    //
    // Depending on the DedupMode, the same producer must reuse the same
    // ID across streams (including after reconnects), otherwise deduplication
    // cannot work: the server tracks committed offsets per producer ID,
    // so a new ID starts a fresh deduplication state and previously committed
    // records may be duplicated.
    //
    // The ID must be unique across producers: two distinct producers
    // sharing an ID will be treated as one and will shadow each other's
    // offsets.
    string producer_id = 1;
    // Integration identification in format `name/version`
    string integration = 2;
    // Deduplication strategy for this stream. Defaults to `OFFSET_BASED`
    // when unset, which requires `producer_id` to be set.
    DeduplicationMode deduplication_mode = 3;
    // Initial ingestion defaults for the stream, letting the client
    // establish its defaults up front instead of following
    // the Start frame with a separate IngestionDefaults frame.
    // Clients can still send further IngestionDefaults frames later
    // to update these defaults during the stream.
    IngestionDefaults defaults = 4;
}

// How the server deduplicates the records of a stream.
//
// The mode is fixed for the lifetime of the stream: it is chosen once in the
// `Start` frame and cannot be changed by a later `IngestionDefaults` frame.
//
// Note that this only controls deduplication. Regardless of the mode, every
// `Invocation` must still carry an `offset`, offsets must still increase
// monotonically within a stream, and `Response.last_committed` still reports
// progress in terms of those offsets.
enum DeduplicationMode {
    // Disable deduplication: every record accepted by the server becomes an
    // invocation.
    //
    // Nothing is tracked across streams, so resending records after a
    // reconnect duplicates them. Pick this mode only when the producer cannot
    // supply a stable ID, or when duplicates are acceptable or already
    // suppressed elsewhere (for example by an `idempotency_key`).
    //
    // `producer_id` is optional in this mode, but is still recorded on traces
    // and metrics when set.
    DISABLED = 0;
    // Deduplicate on `(producer_id, offset)`.
    //
    // The server tracks the highest committed offset per producer ID and
    // silently drops any record whose offset is not above it, which makes
    // resending a range of records after a reconnect safe: records the server
    // already committed do not become duplicate invocations.
    //
    // This mode requires `producer_id` to be set; using it with an empty
    // producer ID fails the stream with `GO_AWAY`. It also requires the
    // producer to reuse the same ID across streams, since a new ID starts
    // from a fresh deduplication state.
    //
    // This is the default: leaving `deduplication_mode` unset selects it.
    OFFSET_BASED = 1;
}
// A IngestionDefaults message defines the default values applied to all
// subsequent records in the stream.
// Each IngestionDefaults message must specify every field it wants to set:
// its fields are not merged with those of previous IngestionDefaults messages.
// Leaving an optional field unset clears any previously established
// default, so later records must supply the value explicitly if needed.
//
// It's okay to send IngestionDefaults more than once to tweak and change the defaults
// during the life time of the stream.
//
// Every field here has a matching field on `Invocation`. For those fields the
// per-record value wins: if the `Invocation` sets the field, its value is used
// and the default from `IngestionDefaults` is ignored; if it leaves the field unset, the
// current default from `IngestionDefaults` is used instead. If neither is set, the field
// is treated as absent, which may be an error for fields that are required for
// the given target (e.g. `key` for virtual objects and workflows).
//
// `headers` are extended with the Invocation's `additional_headers`
// overriding existing keys.
//
// Note: Keep the field tags uniform with the Invocation message
// This allows parsing IngestionInvocation message as IngestionDefaults.
message IngestionDefaults {
    optional string scope = 2;
    optional string limit_key = 3;
    optional string service = 4;
    optional string handler = 5;
    optional string key = 6;
    optional string idempotency_key = 7;
    map<string, string> headers = 8;
}

message IngestionInvocation {
    // Position of this record within the producer's sequence, and the value
    // deduplication is based on.
    //
    // It must increase monotonically for a given producer ID, across the whole
    // lifetime of that producer and not just within a single stream. On
    // reconnect, resume from the `Response.last_committed` reported for the
    // producer rather than restarting the numbering.
    //
    // Offsets do not have to be contiguous; gaps are allowed, so it is fine to
    // skip records. Only the ordering matters. Offsets are 0-based, so 0 is a
    // valid first offset.
    //
    // Within a single stream the server enforces this: sending an offset lower
    // than one already sent on the same stream is a protocol violation and
    // fails the stream with `GO_AWAY`.
    //
    // Across streams nothing is enforced, since the server does not remember
    // what a previous stream sent. Reusing an offset already committed by an
    // earlier stream of the same producer is not reported as an error: the
    // record is treated as a duplicate and silently dropped, meaning it does
    // not become an invocation and produces no `Error` frame. A client that
    // restarts its numbering after a reconnect will therefore see its records
    // disappear without any signal.
    uint64 offset = 1;

    // Overrides
    optional string scope = 2;
    optional string limit_key = 3;
    optional string service = 4;
    optional string handler = 5;
    // Required when the target service is a virtual object (VO).
    // or workflow. This can also be set via a preceding IngestionDefaults message.
    optional string key = 6;
    optional string idempotency_key = 7;
    map<string, string> additional_headers = 8;

    // delay_ms and invoke_time_ts_ms are mutually
    // exclusive.
    optional uint64 delay_ms = 9;
    // starttime timestamp in ms.
    optional uint64 invoke_time_ts_ms = 10;

    // This uses the w3c tracecontext format
    // https://www.w3.org/TR/trace-context/
    optional string traceparent = 11;
    optional string tracestate = 12;

    bytes payload = 13;
}

message IngestionRequest {
    oneof payload {
        IngestionStart start = 1;
        IngestionDefaults defaults = 2;
        IngestionInvocation invocation = 3;
    }
}

// Application-layer flow-control message.
// It tells the client how many more bytes it can send
// before it must wait for the next window update.
//
// WindowUpdate also doubles as an explicit ack: the
// server can send an update with a 0 increment to
// acknowledge commits up to `Response.last_committed`
// without changing the window size.
//
// If the next invocation is bigger than the available
// window, it's legal to send it anyway (letting the
// window go negative) so the client doesn't block. Once
// the window reaches 0 (or less) it's illegal to send
// more requests until the next window update; sending
// more invocations while the window is depleted can
// result in a GO_AWAY error.
message WindowUpdate {
    uint32 increment_bytes = 1;
}

enum ErrorKind {
    ERROR_KIND_UNKNOWN = 0;
    // The server is shutting down and can't accept more
    // records. The caller must switch to a new ingress
    // node and respect the reported last_committed.
    ERROR_KIND_SHUTTING_DOWN = 1;
    // A protocol violation, for example sending another
    // Start message after the initial one or not
    // respecting the send window.
    ERROR_KIND_GO_AWAY = 2;
    // The invocation target was not found (unknown
    // service or handler).
    ERROR_KIND_NOT_FOUND = 3;
    // Covers a wide range of client errors, including:
    // - unexpected key
    // - missing key
    // - invalid scope format
    // and similar errors. The `Error.message` should
    // carry more details.
    ERROR_KIND_BAD_REQUEST = 4;
}

// An error frame. It is always the last frame of the stream: whether the
// error is stream-scoped or record-scoped, the server tears the stream down
// right after sending it and processes no further messages.
//
// Record-scoped errors are the ones that carry `invocation_offset`: the
// record at that offset was rejected (for example a missing key, an unknown
// handler, or an internal ingestion failure) while the stream itself is
// still well-formed. Stream-scoped errors leave `invocation_offset` unset
// and describe a condition of the stream as a whole (shutdown, a protocol
// violation, or invalid `Start`/`IngestionDefaults`).
//
// Even a record-scoped error terminates the stream, on purpose. Skipping the
// faulty record and continuing would commit the records that follow it and
// move the deduplication high water mark past the failed offset, making it
// impossible to ever ingest that record afterwards. Terminating instead
// keeps the high water mark where it is and leaves the decision to the
// client.
//
// Recovery is therefore the client's responsibility: reconnect with the same
// producer ID, resume from the `last_committed` reported on the response
// that carried this error, and skip (or fix) the offending record before
// resending the rest. Note that records after the failed offset may have
// already been sent by the client but were not committed; they must be
// resent.
message Error {
    // if set, the error is associated
    // with the invocation with that offset
    optional uint64 invocation_offset = 1;
    ErrorKind kind = 2;
    string message = 3;
}

message IngestionResponse {
    // Offsets are 0-based, so last_committed must be optional
    // to distinguish "offset 0 committed" from "nothing committed yet".
    // This matters when an error is returned on the first
    // ingestion message.
    optional uint64 last_committed = 1;

    oneof response {
        WindowUpdate window_update = 2;
        Error error = 3;
    }
}

service IngestionSvc {
  // Opens a bidirectional node-to-node stream.
  rpc Ingest(stream IngestionRequest)
      returns (stream IngestionResponse);
}
