syntax = "proto3";

import "restate/common.proto";
import "restate/cluster.proto";
import "google/protobuf/empty.proto";

package restate.cluster_ctrl;

service ClusterCtrlSvc {
  rpc GetClusterState(ClusterStateRequest) returns (ClusterStateResponse);

  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);

  rpc DescribeLog(DescribeLogRequest) returns (DescribeLogResponse);

  rpc TrimLog(TrimLogRequest) returns (google.protobuf.Empty);

  rpc CreatePartitionSnapshot(CreatePartitionSnapshotRequest)
      returns (CreatePartitionSnapshotResponse);

  rpc DropPartitionStore(DropPartitionStoreRequest)
      returns (DropPartitionStoreResponse);

  rpc SealAndExtendChain(SealAndExtendChainRequest)
      returns (SealAndExtendChainResponse);

  rpc SealChain(SealChainRequest) returns (SealChainResponse);

  rpc FindTail(FindTailRequest) returns (FindTailResponse);

  rpc GetClusterConfiguration(GetClusterConfigurationRequest)
      returns (GetClusterConfigurationResponse);

  rpc SetClusterConfiguration(SetClusterConfigurationRequest)
      returns (SetClusterConfigurationResponse);

  rpc Query(QueryRequest) returns (stream QueryResponse);

  rpc MigrateMetadata(MigrateMetadataRequest) returns (MigrateMetadataResponse);

  // Signal the cluster controller to re-fetch epoch metadata for the given
  // partitions. An empty list means all known partitions.
  rpc SyncEpochMetadata(SyncEpochMetadataRequest)
      returns (SyncEpochMetadataResponse);

  // Checks whether all logs and partitions are available given the nodes that
  // are alive, optionally assuming that additional nodes are dead. Only the
  // cluster controller leader answers this request.
  rpc CheckClusterSafety(CheckClusterSafetyRequest)
      returns (CheckClusterSafetyResponse);
}

message SetClusterConfigurationResponse {}
message SetClusterConfigurationRequest {
  restate.cluster.ClusterConfiguration cluster_configuration = 1;
}

message GetClusterConfigurationRequest {}
message GetClusterConfigurationResponse {
  restate.cluster.ClusterConfiguration cluster_configuration = 1;
}

message ClusterStateRequest {}

message ClusterStateResponse { restate.cluster.ClusterState cluster_state = 1; }

message ListLogsRequest {}

message ListLogsResponse {
  // Serialized restate_types::logs::metadata::Logs
  bytes logs = 1;
}

enum TailState {
  TailState_UNKNOWN = 0;
  OPEN = 1;
  SEALED = 2;
}

message DescribeLogRequest { uint32 log_id = 1; }

message DescribeLogResponse {
  uint32 log_id = 5;
  uint32 logs_version = 6;
  // Serialized restate_types::logs::metadata::Chain
  bytes chain = 1;
  TailState tail_state = 2;
  uint64 tail_offset = 3;
  uint64 trim_point = 4;
  // Serialized restate_types::nodes_config::NodesConfiguration
  bytes nodes_configuration = 7;
}

message TrimLogRequest {
  uint32 log_id = 1;
  uint64 trim_point = 2;
}

// Requests a partition snapshot to be archived. Optionally, a minimum
// target LSN for the snapshot may be set and the log can be trimmed to the
// archived LSN at the same time. It is safe to retry this operation on
// error with the same inputs.
message CreatePartitionSnapshotRequest {
  uint32 partition_id = 1;
  // Minimum LSN (inclusive) which must be covered by the snapshot; if set it is
  // treated as a hard requirement and the operation will return an error if it
  // cannot be met
  optional uint64 min_target_lsn = 2;
  // Optionally, also trim the log to the archived LSN; trim only occurs after a
  // successful snapshot and so will honor the min_target_lsn requirement, if
  // set to true
  bool trim_log = 3;
}

message CreatePartitionSnapshotResponse {
  string snapshot_id = 1;
  uint32 log_id = 2;
  // Minimum LSN (inclusive) which is guaranteed to be covered by the snapshot
  uint64 min_applied_lsn = 3;
}

// Deletes a single node's local copy of a partition. All data the node holds
// for this partition is lost; it can only be recovered from a snapshot or by
// replaying the log. This is intended for recovering a node whose partition
// store has been sealed (see BrokenReason), and for removing stores that the
// node keeps although it is no longer part of the partition's replica set.
message DropPartitionStoreRequest {
  uint32 partition_id = 1;
  // The node to delete the partition store from
  restate.common.NodeId node_id = 2;
  // Skip the safety checks and stop a running partition processor before
  // deleting. Without this, the node only deletes a store that no processor
  // uses: either it has already given up on the partition, or it is neither
  // running the partition nor part of its replica set.
  bool force = 3;
  // The newest partition configuration version that the caller based its
  // decision on. Without force, a node that doesn't know this version yet waits
  // a few seconds for it, and refuses if it doesn't arrive. Unset doesn't wait.
  optional restate.common.Version min_partition_configuration_version = 4;
  // Why the store is being dropped. Logged for auditing.
  string reason = 5;
  // Only report what would happen, without changing anything. The node makes
  // the same checks, and answers as if it had dropped the store.
  bool dry_run = 6;
}

message DropPartitionStoreResponse {
  // False if the node had no local partition store to delete. In a dry run,
  // whether it would delete one.
  bool dropped = 1;
  // How much disk space the deleted store used, in bytes, right before the
  // deletion (in a dry run, how much it uses). Unset if nothing was dropped or
  // it couldn't be measured.
  optional uint64 deleted_bytes = 2;
  // Whether the node handled the request as a dry run, without changing
  // anything. Servers that don't support dry runs never set it: if a dry run was
  // requested but this is false, `dropped` reports a real deletion.
  bool dry_run = 3;
}

message ChainExtension {
  // segment_index will be automatically selected (to the index of last segment)
  // if not set.
  optional uint32 segment_index = 2;
  // check `ProviderKind` for possible values.
  string provider = 4;

  // [deprecated] We return an error if this
  // field is set.
  string params = 5;

  // replication_property is required if provider=="replicated"
  optional restate.cluster.ReplicationProperty replication = 6;
  // optional if provider=="replicated", otherwise ignored
  optional restate.common.NodeId sequencer = 7;
  // optional if provider="replicated", otherwise ignored
  repeated restate.common.NodeId nodeset = 8;
}

message SealAndExtendChainRequest {
  uint32 log_id = 1;
  restate.common.Version min_version = 2;
  optional ChainExtension extension = 3;
}

message SealedSegment {
  // segment provider
  string provider = 1;
  // segment params
  string params = 2;
  // tail offset lsn
  uint64 tail_offset = 3;
}

message SealAndExtendChainResponse {
  uint32 new_segment_index = 1;
  SealedSegment sealed_segment = 2;
}

message SealChainRequest {
  uint32 log_id = 1;
  // segment_index will be automatically selected (to the index of last segment)
  // if not set.
  optional uint32 segment_index = 2;
  map<string, string> context = 3;
  // forces the tail LSN to this value. This is extremely dangerous and should be
  // used with extreme caution. If not set, the tail LSN is safely determined automatically.
  optional uint64 tail_lsn = 4;
  // todo: option for permanently sealing the chain when this is fully supported
}

message SealChainResponse {
  // tail offset lsn
  uint64 tail_offset = 1;
}

message FindTailRequest { uint32 log_id = 1; }

message FindTailResponse {
  uint32 log_id = 1;
  uint32 segment_index = 2;
  TailState tail_state = 3;
  uint64 tail_lsn = 4;
}

message QueryRequest {
  // SQL query
  string query = 1;
}

message QueryResponse {
  // arrow encoded record batch
  bytes encoded = 1;
  // Per-node errors encountered during distributed query execution.
  // Populated on the final response message when some nodes failed but
  // partial results are still available.
  repeated QueryWarning warnings = 2;
}

message QueryWarning {
  // Node identifier (e.g. "N1", "N2") where the error originated
  string node_id = 1;
  // Human-readable error message
  string message = 2;
}

message MigrateMetadataRequest {
  // force override target metadata store
  bool force_override = 1;
  // target MetadataClientOptions in json format
  bytes target_client_config = 2;
}

message MigrateMetadataResponse {}

message SyncEpochMetadataRequest {
  // Partitions to re-fetch. Empty = all known partitions.
  repeated uint32 partition_ids = 1;
}

message SyncEpochMetadataResponse {}

message CheckClusterSafetyRequest {
  // Nodes to consider dead in addition to the nodes that are not alive. Use
  // this to check whether it is safe to take these nodes down.
  repeated uint32 assume_dead_nodes = 1;
}

message CheckClusterSafetyResponse {
  // Logs that cannot accept writes, neither on their tail segment nor after a
  // reconfiguration.
  repeated uint32 write_unavailable_logs = 1;
  // Logs with at least one segment whose records cannot be reliably read.
  repeated uint32 read_unavailable_logs = 2;
  // Write-available logs that lose write availability if a single failure
  // domain fails. Domains are at the greatest scope of each log's replication
  // property, e.g. zones for `{zone: 2}`.
  repeated uint32 write_at_risk_logs = 3;
  // Read-available logs that lose read availability if a single failure domain
  // fails.
  repeated uint32 read_at_risk_logs = 4;
  // Logs that cannot be evaluated because they use non-replicated loglets.
  repeated uint32 unchecked_logs = 5;
  // Partitions without an alive replica that the cluster controller cannot
  // move to other nodes, e.g. because their placement is frozen.
  repeated uint32 unavailable_partitions = 6;
  // Available partitions that lose availability if a single failure domain
  // fails. Domains are at the greatest scope of the partition replication.
  repeated uint32 at_risk_partitions = 7;
  // Partitions whose placement is not yet known to the cluster controller.
  repeated uint32 unchecked_partitions = 8;
  // What losing each failure domain alone would make unavailable, for the
  // domains whose loss makes anything unavailable.
  repeated DomainImpact domain_impacts = 9;
  // The greatest scope of the replication of the checked logs and partitions:
  // one of `node`, `zone`, or `region`. Unset if there was nothing to check.
  optional string scope = 10;
  // Nodes that are considered dead, not counting `assume_dead_nodes`.
  repeated uint32 dead_nodes = 11;
  uint32 num_logs = 12;
  uint32 num_partitions = 13;
}

message DomainImpact {
  FailureDomain domain = 1;
  repeated uint32 write_unavailable_logs = 2;
  repeated uint32 read_unavailable_logs = 3;
  repeated uint32 unavailable_partitions = 4;
}

message FailureDomain {
  // One of `node`, `zone`, or `region`
  string scope = 1;
  // The node id for the node scope, otherwise the location, e.g.
  // `region1.zone1`
  string name = 2;
}
