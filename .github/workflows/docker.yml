# Reusable workflow. Consumed by this repo AND by external repos (e.g.
# restate-operator) via `uses: restatedev/restate/.github/workflows/docker.yml@...`.
# Keep it generic: don't hardcode the caller's package/crate names, paths, or image -
# expose them as inputs that default to the restate-server values.
name: Build Docker image

on:
  workflow_call:
    inputs:
      uploadImageAsTarball:
        description: "uploads the Docker image additionally as a tarball with the provided name"
        required: false
        default: ""
        type: string
      platforms:
        description: "platforms for docker build step"
        required: false
        default: ""
        type: string
      parca:
        description: "split out debug symbols and upload to polar signals"
        required: false
        default: false
        type: boolean
      buildIndividually:
        description: "build separate binaries individually to avoid feature unification"
        required: false
        default: false
        type: boolean
      features:
        description: "features to enable in the build"
        required: false
        default: ""
        type: string
      profile:
        description: "cargo profile to build with (must exist in Cargo.toml)"
        required: false
        default: "release"
        type: string
      runnerSize:
        description: "runner size: auto, 16x, or 32x"
        required: false
        default: "auto"
        type: string
      pushToDockerHub:
        description: "push image to DockerHub"
        required: false
        default: false
        type: boolean
      cargoPackage:
        description: "workspace package whose version is used to label the image"
        required: false
        default: "restate-server"
        type: string

  workflow_dispatch:
    inputs:
      hotfixTag:
        description: "hotfix source tag (for example v1.2.3+hotfix.1)"
        required: false
        default: ""
        type: string
      uploadImageAsTarball:
        description: "uploads the Docker image additionally as a tarball with the provided name"
        required: false
        default: ""
        type: string
      platforms:
        description: "platforms for docker build step"
        required: false
        default: ""
        type: string
      parca:
        description: "upload debug symbols to polar signals"
        required: false
        default: false
        type: boolean
      buildIndividually:
        description: "build separate binaries individually to avoid feature unification"
        required: false
        default: false
        type: boolean
      features:
        description: "features to enable in the build"
        required: false
        default: ""
        type: string
      profile:
        description: "cargo profile to build with (must exist in Cargo.toml)"
        required: false
        default: "release"
        type: string
      runnerSize:
        description: "runner size"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - 16x
          - 32x
      pushToDockerHub:
        description: "push image to DockerHub"
        required: false
        default: false
        type: boolean
      cargoPackage:
        description: "workspace package whose version is used to label the image"
        required: false
        default: "restate-server"
        type: string

jobs:
  build-and-push-image:
    if: ${{ inputs.hotfixTag == '' }}
    uses: ./.github/workflows/docker-build.yml
    with:
      uploadImageAsTarball: ${{ inputs.uploadImageAsTarball }}
      platforms: ${{ inputs.platforms }}
      parca: ${{ inputs.parca }}
      buildIndividually: ${{ inputs.buildIndividually }}
      features: ${{ inputs.features }}
      profile: ${{ inputs.profile }}
      runnerSize: ${{ inputs.runnerSize }}
      pushToDockerHub: ${{ inputs.pushToDockerHub }}
      cargoPackage: ${{ inputs.cargoPackage }}
    secrets: inherit

  build-and-push-hotfix:
    if: ${{ inputs.hotfixTag != '' }}
    concurrency:
      group: docker-hotfix-${{ inputs.hotfixTag }}
      cancel-in-progress: false
    uses: ./.github/workflows/docker-build.yml
    with:
      hotfixTag: ${{ inputs.hotfixTag }}
      uploadImageAsTarball: ${{ inputs.uploadImageAsTarball }}
      platforms: ${{ inputs.platforms }}
      parca: ${{ inputs.parca }}
      buildIndividually: ${{ inputs.buildIndividually }}
      features: ${{ inputs.features }}
      profile: ${{ inputs.profile }}
      runnerSize: ${{ inputs.runnerSize }}
      pushToDockerHub: ${{ inputs.pushToDockerHub }}
      cargoPackage: ${{ inputs.cargoPackage }}
    secrets: inherit
