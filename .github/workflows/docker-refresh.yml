name: Refresh Docker Image

# This workflow refreshes existing Restate Docker images (restate and restate-cli)
# with up-to-date base images and packages to include the latest security updates
# WITHOUT rebuilding the Rust binaries.
#
# How it works:
# 1. Determines the latest patch release of the two most recent minor versions
#    (e.g. 1.8.1 and 1.7.14) from the published stable GitHub releases
# 2. Rebuilds the images using Dockerfile.refresh (copies binaries from the existing
#    image onto a fresh base image)
# 3. Pushes with date-suffixed tags (e.g., 1.6.2-20260205), updates the version and
#    minor version tags (e.g., 1.6.2 and 1.6), and updates "latest" for the most
#    recent minor version
#
# This allows security patches in the base OS and installed packages to be deployed
# without waiting for a new Restate release.

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

# `shell: bash` runs steps with `-eo pipefail`, unlike the default `bash -e`
defaults:
  run:
    shell: bash

env:
  GHCR_REGISTRY: ghcr.io
  REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  refresh:
    if: github.repository_owner == 'restatedev'
    permissions:
      contents: read
      packages: write
    name: Refresh ${{ matrix.image.name }} (minor version offset ${{ matrix.minor-offset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0 = most recent minor version, 1 = previous minor version
        minor-offset: [0, 1]
        image:
          # base images must match the release builds (docker/Dockerfile and docker-push-release.yml)
          - name: restate
            target: runtime
            base: debian:trixie-slim
          - name: restate-cli
            target: restate-cli
            base: alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Determine release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Like .github/actions/is-latest-release, use published stable GitHub releases rather than
          # git tags, so that tags whose release build is still running or failed are ignored.
          # Picks the latest patch release of the requested minor version.
          VERSION=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | \
            sed -n 's|^v\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$|\1|p' | sort -rV | \
            awk -F. '!seen[$1 "." $2]++' | sed -n "$(( ${{ matrix.minor-offset }} + 1 ))p")
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine the release to refresh"
            exit 1
          fi
          echo "Release to refresh: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log into GitHub container registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into DockerHub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ matrix.image.name }}
            docker.io/${{ env.REPOSITORY_OWNER }}/${{ matrix.image.name }}
          flavor: |
            latest=${{ matrix.minor-offset == 0 }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},suffix=-{{date 'YYYYMMDD'}}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}

      - name: Build and push refreshed Docker image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: docker/Dockerfile.refresh
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_IMAGE=${{ env.GHCR_REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ matrix.image.name }}:${{ steps.release.outputs.version }}
            BASE_IMAGE=${{ matrix.image.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
