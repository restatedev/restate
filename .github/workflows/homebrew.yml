# Lifted from what dist would generate as the homebrew publish step, except rewriting the download urls to use scarf.
# We also need to deliberately skip the git push this is a pre-release, as Homebrew doesn't support prereleases.

name: Publish homebrew formulae

on:
  workflow_call:
    inputs:
      # comes from cargo-dist workflow call
      plan:
        required: true
        type: string

env:
  PLAN: ${{ inputs.plan }}

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-24.04 # linuxbrew doesn't seem to be working on warpbuild
    env:
      GITHUB_USER: "Restate bot"
      GITHUB_EMAIL: "code+bot@restate.dev"
    steps:
      # Short-lived token of the Homebrew GitHub App, which is installed only on restatedev/homebrew-tap
      - name: Generate token for homebrew-tap
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: restatedev
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v4.4.0
        with:
          repository: "restatedev/homebrew-tap"
          token: ${{ steps.app-token.outputs.token }}
      - name: Check if this is the latest release
        id: is-latest
        uses: $/.github/actions/is-latest-release
        with:
          tag: ${{ github.ref_name }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update

            # Set the Scarf download URLs
            sed -i -E 's%https://github.com/restatedev/restate/releases/download/([^/]+)/([^"]+)%https://restate.gateway.scarf.sh/\1/\2%g' "Formula/${filename}"

            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done

      - name: Push formula files
        # homebrew only really has a single 'latest' version, so we must skip prereleases and older release lines
        if: ${{ !fromJson(inputs.plan).announcement_is_prerelease && steps.is-latest.outputs.is-latest == 'true' }}
        run: git push
