name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      # comes from cargo-dist workflow call
      plan:
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
      # Keep CI on existing maintenance branches during the naming transition.
      - release-*

jobs:
  workspace-hack-check:
    name: Check workspace-hack
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-hakari
      - name: Check workspace-hack Cargo.toml is up-to-date
        run: cargo hakari generate --diff
      - name: Check all crates depend on workspace-hack
        run: cargo hakari manage-deps --dry-run
  cli-sql-tables-check:
    name: Check CLI SQL tables reference
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          rustflags: ""
          cache: false
      - name: Setup Rust Caching
        uses: WarpBuilds/rust-cache@v2.9.1
        with:
          prefix-key: "v1-rust-xtask"
          cache-on-failure: "true"
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      - name: Check cli/src/commands/sql_tables.rs is up-to-date
        run: |
          cargo xtask generate-cli-sql-tables > cli/src/commands/sql_tables.rs
          git diff --exit-code cli/src/commands/sql_tables.rs || \
            (echo "::error::cli/src/commands/sql_tables.rs is stale, run: cargo xtask generate-cli-sql-tables > cli/src/commands/sql_tables.rs" && exit 1)
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [warp-ubuntu-latest-x64-16x]
    env:
      RUST_BACKTRACE: full
    steps:
      # Disabled as uring is not used in production yet.
      # - name: Install liburing
      #   run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - uses: actions/checkout@v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          rustflags: ""
          cache: false

      - name: Setup Rust Caching
        uses: WarpBuilds/rust-cache@v2.9.1
        with:
          prefix-key: "v1-rust"
          cache-on-failure: "true"

      - name: Disk usage after cache restore
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-hakari

      - name: Disable hakari
        run: cargo hakari disable

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Install nextest
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: nextest@0.9.98

      - name: Setup just
        uses: extractions/setup-just@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Cargo.lock file is updated
        run: cargo update -w --locked

      - name: Run lint
        run: just lint

      - name: Disk usage after lint
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Run test
        run: just test
        env:
          LOCAL_CLUSTER_RUNNER_FORWARD_LOGS: "true"
          LOCAL_CLUSTER_RUNNER_RETAIN_TEMPDIR: "true"
          LOCAL_CLUSTER_RUNNER_TEMPDIR: ${{ runner.temp }}/lcr

      - name: Disk usage after test
        if: always()
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Run doctest
        run: just doctest

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: local-cluster-runner
          path: ${{ runner.temp }}/lcr

      - name: Disk usage before cache save
        if: always()
        run: df -h / && du -sh target/ 2>/dev/null || true

  docker:
    name: Create docker image
    uses: ./.github/workflows/docker.yml
    with:
      uploadImageAsTarball: "restate.tar"
      platforms: linux/amd64
      # additional features added for CI validation builds only
      features: metadata-api
      # faster-linking profile for PRs; main and release builds keep `release` (and its image tags)
      profile: ${{ github.event_name == 'pull_request' && 'release-lite' || 'release' }}

  sdk-java:
    name: Run SDK-Java integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-java/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-java:main"

  sdk-java-vqueues:
    name: Vqueues Run SDK-Java integration tests
    # for the time being we don't expect all tests to pass
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-java/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-java:main"
      testArtifactOutput: sdk-java-integration-vqueues-test-report
      envVars: |
        RESTATE_EXPERIMENTAL_ENABLE_VQUEUES=true
      # we don't expect all tests to pass, that's why we continue on error
      continueOnError: true

  sdk-python:
    name: Run SDK-Python integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-python/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-python:main"

  sdk-python-protocol-v7:
    name: Run SDK-Python integration tests with Protocol V7
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-python/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-python:main"
      envVars: |
        RESTATE_experimental_enable_protocol_v7=true
      testArtifactOutput: sdk-python-protocol-v7-test-report

  sdk-go:
    name: Run SDK-Go integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-go/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}

  sdk-typescript:
    name: Run SDK-Typescript integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-node:main"

  sdk-typescript-protocol-v7:
    name: Run SDK-Typescript integration tests with Protocol V7
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      envVars: |
        RESTATE_experimental_enable_protocol_v7=true
      testArtifactOutput: sdk-typescript-protocol-v7-test-report

  sdk-typescript-bilrost-schema:
    name: Run SDK-Typescript integration tests with Bilrost schema encoding
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      envVars: |
        RESTATE_experimental_enable_schema_bilrost_encoding=true
      testArtifactOutput: sdk-typescript-bilrost-schema-test-report

  sdk-rust:
    name: Run SDK-Rust integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-rust/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      serviceImage: "ghcr.io/restatedev/test-services-rust:main"

  e2e:
    name: Run E2E tests
    runs-on: warp-ubuntu-latest-x64-4x
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Download the Restate container image, if needed
      - name: Download restate snapshot from in-progress workflow
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests
      - name: Run E2E tests
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest

  e2e-bilrost-schema:
    name: Run E2E tests with bilrost schema
    runs-on: warp-ubuntu-latest-x64-4x
    # we don't expect all tests to pass, that's why we continue on error
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Download the Restate container image, if needed
      - name: Download restate snapshot from in-progress workflow
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests with bilrost schema enabled.
      - name: Run E2E tests
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-bilrost-schema-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest
          envVars: |
            RESTATE_experimental_enable_schema_bilrost_encoding=true
          exclusions: |
            exclusions:
              "versionCompat":
                - "dev.restate.sdktesting.tests.ForwardCompatibilityTest.*"
                - "dev.restate.sdktesting.tests.BackwardCompatibilityTest.*"

  e2e-vqueues:
    name: Run E2E tests with vqueues
    runs-on: warp-ubuntu-latest-x64-4x
    # we don't expect all tests to pass, that's why we continue on error
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Download the Restate container image, if needed
      - name: Download restate snapshot from in-progress workflow
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests with vqueues enabled.
      - name: Run E2E tests
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-vqueues-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest
          envVars: |
            RESTATE_EXPERIMENTAL_ENABLE_VQUEUES=true
          # We will never support the forward compatibility tests for v1.5 when using vqueues.
          # The backward compatibility tests are temporarily disabled until we support migration from v1.5 -> v1.6
          exclusions: |
            exclusions:
              "versionCompat":
                - "dev.restate.sdktesting.tests.ForwardCompatibilityTest.*"
                - "dev.restate.sdktesting.tests.BackwardCompatibilityTest.*"
