name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      # comes from cargo-dist workflow call
      plan:
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
      - hotfix/*
      # Keep CI on existing maintenance branches during the naming transition.
      - release-*

# One run per PR: a new push cancels the older run. Some pushes also start two
# `pull_request` runs for the same commit at once; this keeps only one of them.
# Other events get a unique group, so they never wait on or cancel each other.
# `github.workflow` is the caller's name when Release calls this workflow, which keeps
# that run from cancelling the PR's own CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-hack-check:
    name: Check workspace-hack
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4.4.0
      # Lock a commit from master; toolchain branches are regenerated upstream.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-hakari
      - name: Check workspace-hack Cargo.toml is up-to-date
        run: cargo hakari generate --diff
      - name: Check all crates depend on workspace-hack
        run: cargo hakari manage-deps --dry-run
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000/tcp
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [warp-ubuntu-latest-x64-16x]
    env:
      RUST_BACKTRACE: full
    steps:
      # Disabled as uring is not used in production yet.
      # - name: Install liburing
      #   run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - uses: actions/checkout@v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          rustflags: ""
          cache: false

      - name: Setup Rust Caching
        uses: WarpBuilds/rust-cache@v2.9.1 # a fork of Swatinem/rust-cache@v2 that uses warpbuild cache
        with:
          prefix-key: "v1-rust"
          cache-on-failure: "true"

      - name: Disk usage after cache restore
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-hakari

      - name: Disable hakari
        run: cargo hakari disable

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Install nextest
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: nextest@0.9.98

      - name: Setup just
        uses: extractions/setup-just@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Cargo.lock file is updated
        run: cargo update -w --locked

      - name: Run lint
        id: lint
        run: just lint
        env:
          # Also fail on Cargo's own lints (e.g. cargo::unused_dependencies)
          CARGO_BUILD_WARNINGS: deny

      - name: Disk usage after lint
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Run test
        run: just test
        env:
          LOCAL_CLUSTER_RUNNER_FORWARD_LOGS: "true"
          LOCAL_CLUSTER_RUNNER_RETAIN_TEMPDIR: "true"
          LOCAL_CLUSTER_RUNNER_TEMPDIR: ${{ runner.temp }}/lcr

      - name: Prepare Azurite
        env:
          AZURITE_PORT: ${{ job.services.azurite.ports[10000] }}
          AZURITE_CONTAINER: ${{ job.services.azurite.id }}
        run: |
          curl --silent --show-error --output /dev/null \
            --retry 20 --retry-connrefused --retry-delay 1 --max-time 2 \
            "http://127.0.0.1:${AZURITE_PORT}/"
          docker run --rm --network "container:${AZURITE_CONTAINER}" \
            mcr.microsoft.com/azure-cli:2.90.0 \
            az storage container create --name restate-metadata \
            --connection-string "UseDevelopmentStorage=true"

      - name: Test Azure Blob metadata store
        env:
          AZURE_STORAGE_USE_EMULATOR: "true"
          AZURITE_BLOB_STORAGE_URL: http://127.0.0.1:${{ job.services.azurite.ports[10000] }}
          RESTATE_METADATA_TEST_OBJECT_STORE_PATH: az://restate-metadata/metadata
        run: |
          cargo nextest run -p restate-metadata-providers --features objstore \
            -E 'test(conditional_writes_against_real_object_store)' \
            --run-ignored ignored-only

      - name: Disk usage after test
        if: always()
        run: df -h / && du -sh target/ 2>/dev/null || true

      - name: Run doctest
        run: just doctest

      # Runs here to reuse the build cache. It also runs when tests fail, so a
      # stale file is reported in the same CI run.
      - name: Check cli/src/commands/sql_tables.rs is up-to-date
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: |
          cargo xtask generate-cli-sql-tables > cli/src/commands/sql_tables.rs
          git diff --exit-code cli/src/commands/sql_tables.rs || \
            (echo "::error::cli/src/commands/sql_tables.rs is stale, run: cargo xtask generate-cli-sql-tables > cli/src/commands/sql_tables.rs" && exit 1)

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: local-cluster-runner
          path: ${{ runner.temp }}/lcr

      - name: Disk usage before cache save
        if: always()
        run: df -h / && du -sh target/ 2>/dev/null || true

  docker:
    name: Create docker image
    # pushes to ghcr.io on main
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      uploadImageAsTarball: "restate.tar"
      # Test jobs restore the tarball from the WarpBuild cache, which is much faster than the
      # artifact download. The artifact stays as a fallback and for Jepsen and manual SDK runs.
      cacheImageTarball: true
      platforms: linux/amd64
      # additional features added for CI validation builds only
      features: metadata-api
      # faster-linking profile for PRs; main and release builds keep `release` (and its image tags)
      profile: ${{ github.event_name == 'pull_request' && 'release-lite' || 'release' }}
      # A PR's cache entries land in that PR's own scope, which other PRs can't read, and
      # exporting the dependency layer took 7-13 minutes. `docker-pr-cache` below warms it from main.
      cacheReadOnly: ${{ github.event_name == 'pull_request' }}

  docker-pr-cache:
    name: Warm PR docker build cache
    # PR docker builds only read the build cache. This builds their dependency layer on
    # main so PRs can restore it instead of rebuilding ~800 crates.
    # The inputs must match the PR build of the `docker` job above, or the layer's
    # cache key won't match.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      cacheOnly: true
      platforms: linux/amd64
      features: metadata-api
      profile: release-lite

  sdk-java:
    name: Run SDK-Java integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-java/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      serviceImage: "ghcr.io/restatedev/test-services-java:main"

  sdk-python:
    name: Run SDK-Python integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-python/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      serviceImage: "ghcr.io/restatedev/test-services-python:main"

  sdk-go:
    name: Run SDK-Go integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-go/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}

  sdk-typescript:
    name: Run SDK-Typescript integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      serviceImage: "ghcr.io/restatedev/test-services-node:main"

  sdk-typescript-protocol-v8:
    name: Run SDK-Typescript integration tests with Protocol V8
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      envVars: |
        RESTATE_experimental_enable_protocol_v8=true
      testArtifactOutput: sdk-typescript-protocol-v8-test-report
      serviceImage: "ghcr.io/restatedev/test-services-node:main"

  sdk-typescript-bilrost-schema:
    name: Run SDK-Typescript integration tests with Bilrost schema encoding
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      envVars: |
        RESTATE_experimental_enable_schema_bilrost_encoding=true
      testArtifactOutput: sdk-typescript-bilrost-schema-test-report
      serviceImage: "ghcr.io/restatedev/test-services-node:main"

  sdk-typescript-write-blob-table:
    name: Run SDK-Typescript integration tests with Write Blob Table
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-typescript/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      envVars: |
        RESTATE_EXPERIMENTAL_ENABLE_WRITE_BLOB_TABLE=true
        RESTATE_WORKER__INLINE_JOURNAL_ENTRY_THRESHOLD=0
      testArtifactOutput: sdk-typescript-write-blob-table-test-report
      serviceImage: "ghcr.io/restatedev/test-services-node:main"

  sdk-rust:
    name: Run SDK-Rust integration tests
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    secrets: inherit
    needs: docker
    uses: restatedev/sdk-rust/.github/workflows/integration.yaml@main
    with:
      restateCommit: ${{ github.event.pull_request.head.sha || github.sha }}
      restateImageCacheKey: ${{ needs.docker.outputs.tarballCacheKey }}
      serviceImage: "ghcr.io/restatedev/test-services-rust:main"

  e2e:
    name: Run E2E tests
    runs-on: warp-ubuntu-latest-x64-4x
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Get the Restate container image: from the WarpBuild cache, or the artifact as a fallback
      - name: Restore restate snapshot from the WarpBuild cache
        id: restate-image-cache
        if: ${{ needs.docker.outputs.tarballCacheKey != '' }}
        uses: WarpBuilds/cache/restore@v1.4.13
        with:
          path: restate.tar
          key: ${{ needs.docker.outputs.tarballCacheKey }}
      - name: Download restate snapshot from in-progress workflow
        if: ${{ steps.restate-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests
      - name: Run E2E tests
        # Pinned to a commit in actions.lock. To pick up the latest e2e main, run:
        #   gh actions-lock --relock .github/workflows/ci.yml
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest

  e2e-bilrost-schema:
    name: Run E2E tests with bilrost schema
    runs-on: warp-ubuntu-latest-x64-4x
    # we don't expect all tests to pass, that's why we continue on error
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Get the Restate container image: from the WarpBuild cache, or the artifact as a fallback
      - name: Restore restate snapshot from the WarpBuild cache
        id: restate-image-cache
        if: ${{ needs.docker.outputs.tarballCacheKey != '' }}
        uses: WarpBuilds/cache/restore@v1.4.13
        with:
          path: restate.tar
          key: ${{ needs.docker.outputs.tarballCacheKey }}
      - name: Download restate snapshot from in-progress workflow
        if: ${{ steps.restate-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests with bilrost schema enabled.
      - name: Run E2E tests
        # Pinned to a commit in actions.lock. To pick up the latest e2e main, run:
        #   gh actions-lock --relock .github/workflows/ci.yml
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-bilrost-schema-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest
          envVars: |
            RESTATE_experimental_enable_schema_bilrost_encoding=true
          exclusions: |
            exclusions:
              "versionCompat":
                - "dev.restate.sdktesting.tests.ForwardCompatibilityTest.*"
                - "dev.restate.sdktesting.tests.BackwardCompatibilityTest.*"

  e2e-write-blob-table:
    name: Run E2E tests with Write Blob Table feature
    runs-on: warp-ubuntu-latest-x64-4x
    # we don't expect all tests to pass, that's why we continue on error
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      actions: read
    needs: docker
    steps:
      - name: Set up Docker containerd snapshotter
        uses: docker/setup-docker-action@v4.7.0
        with:
          version: "v28.5.2"
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      ### Get the Restate container image: from the WarpBuild cache, or the artifact as a fallback
      - name: Restore restate snapshot from the WarpBuild cache
        id: restate-image-cache
        if: ${{ needs.docker.outputs.tarballCacheKey != '' }}
        uses: WarpBuilds/cache/restore@v1.4.13
        with:
          path: restate.tar
          key: ${{ needs.docker.outputs.tarballCacheKey }}
      - name: Download restate snapshot from in-progress workflow
        if: ${{ steps.restate-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: restate.tar
      - name: Install restate snapshot
        run: |
          output=$(docker load --input restate.tar | head -n 1)
          docker tag "${output#*: }" "localhost/restatedev/restate-commit-download:latest"
          docker image ls -a

      ### Run e2e tests with blob table enabled.
      - name: Run E2E tests
        # Pinned to a commit in actions.lock. To pick up the latest e2e main, run:
        #   gh actions-lock --relock .github/workflows/ci.yml
        uses: restatedev/e2e/e2e-tests@main
        with:
          testArtifactOutput: e2e-test-write-blob-table-report
          restateContainerImage: localhost/restatedev/restate-commit-download:latest
          envVars: |
            RESTATE_EXPERIMENTAL_ENABLE_WRITE_BLOB_TABLE=true
            RESTATE_WORKER__INLINE_JOURNAL_ENTRY_THRESHOLD=0
          # disable ForwardCompatibility tests, and only keep BackwardCompatibility
          exclusions: |
            exclusions:
              "versionCompat":
                - "dev.restate.sdktesting.tests.ForwardCompatibilityTest.*"

