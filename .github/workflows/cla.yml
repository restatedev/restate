name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]
  workflow_call:

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: read # this can be 'read' if the signatures are in remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # Short-lived token of the CLA GitHub App, which is installed only on restatedev/cla-signatures
      - name: "Generate token for cla-signatures"
        id: app-token
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: restatedev
          repositories: cla-signatures
          permission-contents: write
      - name: "CLA Assistant"
        if: steps.app-token.outcome == 'success'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # used to read and write the signatures in the remote repository
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: 'restate/cla-signatures.json'
          path-to-document: 'https://github.com/restatedev/restate/blob/main/docs/dev/cla.md'
          # branch should not be protected
          branch: 'main'
          remote-organization-name: 'restatedev'
          remote-repository-name: 'cla-signatures'
          allowlist: github-actions[bot],dependabot[bot],claude,pullfrog[bot],restatedev-web-ui[bot]